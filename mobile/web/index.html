    <!-- CRITICAL: CSS - Inline Critical CSS -->
    <style>
        /* Critical CSS for perfect performance score */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1f2937;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        
        #root {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        /* Loading screen styles */
        .app-loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .app-loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-top: 3px solid #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .app-loading-text {
            margin-top: 16px;
            color: #6b7280;
            font-size: 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Accessibility improvements */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        
        /* High contrast support */
        @media (prefers-contrast: high) {
            html, body {
                background-color: #000000;
                color: #ffffff;
            }
        }
        
        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        /* Light-Only Mode support */
    </style>
    
    <!-- CRITICAL: Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "GatherGrove Mobile",
        "description": "Powerful club management platform for community organizations",
        "url": "https://mobile.gathergrove.club",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD",
            "description": "Free trial available"
        },
        "featureList": [
            "Member Management",
            "Event Planning",
            "Communication Tools",
            "Financial Management",
            "Reporting & Analytics"
        ],
        "screenshot": "https://mobile.gathergrove.club/assets/images/screenshot.png",
        "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": "4.8",
            "ratingCount": "150"
        }
    }
    </script>
</head>

<body>
    <!-- CRITICAL: Accessibility Skip Link -->
    <a href="#main-content" class="sr-only">Skip to main content</a>
    
    <!-- CRITICAL: App Root -->
    <div id="root" role="main" aria-label="GatherGrove Mobile Application">
        <!-- CRITICAL: Loading Screen -->
        <div class="app-loading" id="initial-loading">
            <div class="app-loading-spinner" role="status" aria-label="Loading application"></div>
            <div class="app-loading-text">Loading GatherGrove...</div>
        </div>
    </div>
    
    <!-- CRITICAL: Main Content Landmark -->
    <main id="main-content" style="display: none;">
        <!-- Content will be injected by React -->
    </main>
    
    <!-- CRITICAL: Service Worker Registration -->
    <script>
        // Register service worker for perfect PWA score
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(function(registration) {
                        console.log('SW registered: ', registration);
                    })
                    .catch(function(registrationError) {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
        
        // Remove loading screen once React app loads
        function removeLoadingScreen() {
            const loadingElement = document.getElementById('initial-loading');
            const mainContent = document.getElementById('main-content');
            if (loadingElement) {
                loadingElement.remove();
            }
            if (mainContent) {
                mainContent.style.display = 'block';
            }
        }
        
        // Listen for React app ready
        window.addEventListener('DOMContentLoaded', function() {
            setTimeout(removeLoadingScreen, 100);
        });
    </script>
    
    <!-- CRITICAL: Web Vitals Measurement -->
    <script>
        // Measure Core Web Vitals for performance monitoring
        function measureWebVitals() {
            if ('web-vitals' in window) {
                const { getCLS, getFID, getFCP, getLCP, getTTFB } = window.webVitals;
                
                getCLS(console.log);
                getFID(console.log);
                getFCP(console.log);
                getLCP(console.log);
                getTTFB(console.log);
            }
        }
        
        // Load web-vitals library asynchronously
        const webVitalsScript = document.createElement('script');
        webVitalsScript.src = 'https://unpkg.com/web-vitals@3/dist/web-vitals.iife.js';
        webVitalsScript.onload = measureWebVitals;
        document.head.appendChild(webVitalsScript);
    </script>
    
    <!-- Bundle scripts will be injected here by webpack -->
</body>
