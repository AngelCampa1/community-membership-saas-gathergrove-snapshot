# Backend Build and Test Pipeline
# Manual trigger only to conserve build minutes

trigger: none
pr: none

variables:
  buildConfiguration: 'Release'
  dotNetFramework: 'net9.0'
  dotNetVersion: '9.0.x'
  workingDirectory: '$(System.DefaultWorkingDirectory)/backend'

stages:
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: Build
    displayName: 'Build Backend'
    pool:
      vmImage: 'ubuntu-latest'  # Use Microsoft-hosted agent

    steps:
    # Setup .NET 9
    - task: UseDotNet@2
      displayName: 'Use .NET $(dotNetVersion)'
      inputs:
        packageType: 'sdk'
        version: '9.0.x'
        includePreviewVersions: false

    # Display .NET version for debugging
    - script: |
        dotnet --version
        dotnet --list-sdks
      displayName: 'Display .NET version'
      workingDirectory: $(workingDirectory)

    # Restore dependencies
    - task: DotNetCoreCLI@2
      displayName: 'Restore packages'
      inputs:
        command: 'restore'
        projects: '$(workingDirectory)/**/*.csproj'
        workingDirectory: $(workingDirectory)

    # Build solution
    - task: DotNetCoreCLI@2
      displayName: 'Build solution'
      inputs:
        command: 'build'
        projects: '$(workingDirectory)/**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'
        workingDirectory: $(workingDirectory)

    # Run tests using script to avoid argument parsing issues
    - script: |
        echo "Running backend tests..."
        dotnet test --configuration $(buildConfiguration) --verbosity normal --no-build --logger trx --results-directory $(Agent.TempDirectory)
      displayName: 'Run tests'
      workingDirectory: $(workingDirectory)
      env:
        ASPNETCORE_ENVIRONMENT: 'Test'
        USE_INMEMORY_DB: 'true'

    # Publish test results manually
    - task: PublishTestResults@2
      displayName: 'Publish test results'
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '**/*.trx'
        searchFolder: '$(Agent.TempDirectory)'
        mergeTestResults: true
        testRunTitle: 'Backend Tests'
      condition: succeededOrFailed()

    # Security audit: fail the build on high/critical vulnerable packages
    - script: |
        set -euo pipefail
        dotnet list GatherGrove.sln package --vulnerable --include-transitive | tee $(Agent.TempDirectory)/nuget-vulnerabilities.txt
        if grep -Eiq '\b(High|Critical)\b' $(Agent.TempDirectory)/nuget-vulnerabilities.txt; then
          echo "High or critical NuGet vulnerabilities were found."
          exit 1
        fi
      displayName: 'Security audit'
      workingDirectory: '$(workingDirectory)'

    # Create artifacts only after build, tests, and audit pass
    - task: DotNetCoreCLI@2
      displayName: 'Publish application'
      inputs:
        command: 'publish'
        projects: '$(workingDirectory)/src/GatherGrove.API/GatherGrove.API.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) --no-build --framework $(dotNetFramework)'
        publishWebProjects: false
        zipAfterPublish: true
        workingDirectory: $(workingDirectory)

    # Publish build artifacts
    - task: PublishBuildArtifacts@1
      displayName: 'Publish build artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'backend-drop'
        publishLocation: 'Container'
