# Mobile All-in-One Pipeline
# Build, deploy, and distribute mobile apps with full control over platforms and targets
# Manual trigger with parameters to select exactly what you want to do

trigger: none
pr: none

# Pipeline parameters for complete control
parameters:
- name: runTests
  displayName: '🧪 Run Tests'
  type: boolean
  default: true

# Build Parameters
- name: buildIOS
  displayName: '🍎 Build iOS'
  type: boolean
  default: false
- name: buildAndroid
  displayName: '🤖 Build Android'
  type: boolean
  default: false
- name: buildProfile
  displayName: '🔨 Build Profile'
  type: string
  default: 'preview'
  values:
  - 'development'
  - 'preview'
  - 'production'

# Distribution Parameters
- name: distributeExpoUpdates
  displayName: '📡 Distribute via Expo Updates'
  type: boolean
  default: false
- name: distributeFirebase
  displayName: '🔥 Distribute via Firebase App Distribution'
  type: boolean
  default: false
- name: distributeAppCenter
  displayName: '🏢 Distribute via App Center'
  type: boolean
  default: false

# Store Deployment Parameters
- name: deployTestFlight
  displayName: '✈️ Deploy to TestFlight'
  type: boolean
  default: false
- name: deployPlayInternal
  displayName: '🎮 Deploy to Play Console (Internal)'
  type: boolean
  default: false
- name: deployPlayBeta
  displayName: '🎯 Deploy to Play Console (Beta)'
  type: boolean
  default: false
- name: deployPlayProduction
  displayName: '🚀 Deploy to Play Store (Production)'
  type: boolean
  default: false
- name: deployAppStore
  displayName: '🏪 Deploy to App Store (Production)'
  type: boolean
  default: false

# General Parameters
- name: releaseNotes
  displayName: '📝 Release Notes'
  type: string
  default: 'New build available'
- name: distributionChannel
  displayName: '📢 Expo Update Channel'
  type: string
  default: 'default'

variables:
  nodeVersion: '22.x'
  workingDirectory: '$(System.DefaultWorkingDirectory)/mobile'
  EXPO_TOKEN: $(EXPO_ACCESS_TOKEN)

stages:
- stage: Test
  displayName: '🧪 Test Mobile App'
  condition: eq('${{ parameters.runTests }}', 'true')
  jobs:
  - job: RunTests
    displayName: 'Run Tests & Quality Checks'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: NodeTool@0
      displayName: 'Setup Node.js'
      inputs:
        versionSpec: '$(nodeVersion)'

    - task: Cache@2
      displayName: 'Cache npm packages'
      inputs:
        key: 'npm | "$(Agent.OS)" | mobile/package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
          npm
        path: '$(Pipeline.Workspace)/.npm'

    - script: |
        cd $(workingDirectory)
        npm ci --legacy-peer-deps --cache $(Pipeline.Workspace)/.npm --prefer-offline
      displayName: 'Install dependencies'

    - script: |
        cd $(workingDirectory)
        npm run lint
      displayName: 'Lint code'

    - script: |
        cd $(workingDirectory)
        npm run typecheck
      displayName: 'TypeScript check'

    - script: |
        cd $(workingDirectory)
        npm test -- --coverage --watchAll=false --ci
      displayName: 'Run tests'

    - task: PublishCodeCoverageResults@1
      displayName: 'Publish code coverage'
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(workingDirectory)/coverage/cobertura-coverage.xml'
      condition: succeededOrFailed()

    - script: |
        cd $(workingDirectory)
        npm audit --audit-level=high
      displayName: 'Security audit'

- stage: BuildiOS
  displayName: '🍎 Build iOS App'
  dependsOn: Test
  condition: and(succeeded('Test'), eq('${{ parameters.buildIOS }}', 'true'))
  jobs:
  - job: BuildiOS
    displayName: '🍎 Build iOS App'
    pool:
      vmImage: 'macos-latest'

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: |
        cd $(workingDirectory)
        npm ci --legacy-peer-deps
      displayName: 'Install dependencies'

    - script: |
        cd $(workingDirectory)
        npx --no-install expo whoami
      displayName: 'Verify audited Expo CLI'
      env:
        EXPO_TOKEN: $(EXPO_TOKEN)

    - script: |
        cd $(workingDirectory)
        echo "EAS CLI is not present in mobile/package-lock.json."
        echo "Add eas-cli as a pinned mobile devDependency, regenerate package-lock.json, and let npm audit cover it before enabling iOS release builds."
        exit 1
      displayName: 'Block unaudited iOS EAS build'
      env:
        EXPO_TOKEN: $(EXPO_TOKEN)
      timeoutInMinutes: 45

- stage: BuildAndroid
  displayName: '🤖 Build Android App'
  dependsOn: Test
  condition: and(succeeded('Test'), eq('${{ parameters.buildAndroid }}', 'true'))
  jobs:
  - job: BuildAndroid
    displayName: '🤖 Build Android App'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: |
        cd $(workingDirectory)
        npm ci --legacy-peer-deps
      displayName: 'Install dependencies'

    - script: |
        cd $(workingDirectory)
        npx --no-install expo whoami
      displayName: 'Verify audited Expo CLI'
      env:
        EXPO_TOKEN: $(EXPO_TOKEN)

    - script: |
        cd $(workingDirectory)
        echo "EAS CLI is not present in mobile/package-lock.json."
        echo "Add eas-cli as a pinned mobile devDependency, regenerate package-lock.json, and let npm audit cover it before enabling Android release builds."
        exit 1
      displayName: 'Block unaudited Android EAS build'
      env:
        EXPO_TOKEN: $(EXPO_TOKEN)
      timeoutInMinutes: 45

- stage: Distribute
  displayName: '📡 Distribute Apps'
  dependsOn: 
  - BuildiOS
  - BuildAndroid
  condition: and(succeeded(), succeeded('Test'), or(eq('${{ parameters.distributeExpoUpdates }}', 'true'), eq('${{ parameters.distributeFirebase }}', 'true'), eq('${{ parameters.distributeAppCenter }}', 'true')))
  jobs:
  - job: ExpoUpdates
    displayName: '📡 Expo Over-the-Air Updates'
    condition: and(succeeded(), eq('${{ parameters.distributeExpoUpdates }}', 'true'))
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: |
        cd $(workingDirectory)
        npm ci --legacy-peer-deps
        npx --no-install expo publish --non-interactive --release-channel ${{ parameters.distributionChannel }}
      displayName: 'Setup environment and publish Expo update'
      env:
        EXPO_TOKEN: $(EXPO_TOKEN)

  - job: FirebaseDistribution
    displayName: '🔥 Firebase App Distribution'
    condition: and(succeeded(), eq('${{ parameters.distributeFirebase }}', 'true'))
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: |
        cd $(workingDirectory)
        echo "Firebase CLI is not present in mobile/package-lock.json."
        echo "Add firebase-tools as a pinned mobile devDependency, regenerate package-lock.json, and let npm audit cover it before enabling Firebase distribution."
        exit 1
      displayName: 'Block unaudited Firebase CLI'

    - script: |
        echo "Firebase App Distribution setup required"
        echo "Configure Firebase project and authentication"
        echo "Release notes: ${{ parameters.releaseNotes }}"
        # Add your Firebase distribution logic here
      displayName: 'Distribute via Firebase'
      env:
        FIREBASE_TOKEN: $(FIREBASE_TOKEN)

  - job: AppCenterDistribution
    displayName: '🏢 App Center Distribution'
    condition: and(succeeded(), eq('${{ parameters.distributeAppCenter }}', 'true'))
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: |
        cd $(workingDirectory)
        echo "App Center CLI is not present in mobile/package-lock.json."
        echo "Add appcenter-cli as a pinned mobile devDependency, regenerate package-lock.json, and let npm audit cover it before enabling App Center distribution."
        exit 1
      displayName: 'Block unaudited App Center CLI'

    - script: |
        echo "App Center distribution setup required"
        echo "Configure App Center apps and authentication"
        echo "Release notes: ${{ parameters.releaseNotes }}"
        # Add your App Center distribution logic here
      displayName: 'Distribute via App Center'
      env:
        APPCENTER_ACCESS_TOKEN: $(APPCENTER_ACCESS_TOKEN)

- stage: Deploy
  displayName: '🚀 Deploy to Stores'
  dependsOn: 
  - BuildiOS
  - BuildAndroid
  condition: and(succeeded(), succeeded('Test'), or(eq('${{ parameters.deployTestFlight }}', 'true'), eq('${{ parameters.deployPlayInternal }}', 'true'), eq('${{ parameters.deployPlayBeta }}', 'true'), eq('${{ parameters.deployPlayProduction }}', 'true'), eq('${{ parameters.deployAppStore }}', 'true')))
  jobs:
  - job: TestFlightDeploy
    displayName: '✈️ Deploy to TestFlight'
    condition: and(succeeded(), eq('${{ parameters.deployTestFlight }}', 'true'))
    pool:
      vmImage: 'macos-latest'

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: |
        cd $(workingDirectory)
        npm ci --legacy-peer-deps
        echo "EAS CLI is not present in mobile/package-lock.json."
        echo "Add eas-cli as a pinned mobile devDependency, regenerate package-lock.json, and let npm audit cover it before enabling TestFlight submissions."
        exit 1
      displayName: 'Block unaudited TestFlight submit'
      env:
        EXPO_TOKEN: $(EXPO_TOKEN)
        APPLE_ID: $(APPLE_ID)
        APPLE_APP_SPECIFIC_PASSWORD: $(APPLE_APP_SPECIFIC_PASSWORD)
        APPLE_TEAM_ID: $(APPLE_TEAM_ID)
      timeoutInMinutes: 30

  - job: AppStoreDeploy
    displayName: '🏪 Deploy to App Store'
    condition: and(succeeded(), eq('${{ parameters.deployAppStore }}', 'true'))
    pool:
      vmImage: 'macos-latest'

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: |
        cd $(workingDirectory)
        npm ci --legacy-peer-deps
        echo "EAS CLI is not present in mobile/package-lock.json."
        echo "Add eas-cli as a pinned mobile devDependency, regenerate package-lock.json, and let npm audit cover it before enabling App Store submissions."
        exit 1
      displayName: 'Block unaudited App Store submit'
      env:
        EXPO_TOKEN: $(EXPO_TOKEN)
        APPLE_ID: $(APPLE_ID)
        APPLE_APP_SPECIFIC_PASSWORD: $(APPLE_APP_SPECIFIC_PASSWORD)
        APPLE_TEAM_ID: $(APPLE_TEAM_ID)
      timeoutInMinutes: 30

  - job: PlayInternalDeploy
    displayName: '🎮 Deploy to Play Console (Internal)'
    condition: and(succeeded(), eq('${{ parameters.deployPlayInternal }}', 'true'))
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: |
        cd $(workingDirectory)
        npm ci --legacy-peer-deps
        echo "EAS CLI is not present in mobile/package-lock.json."
        echo "Add eas-cli as a pinned mobile devDependency, regenerate package-lock.json, and let npm audit cover it before enabling Play Internal submissions."
        exit 1
      displayName: 'Block unaudited Play Internal submit'
      env:
        EXPO_TOKEN: $(EXPO_TOKEN)
        GOOGLE_SERVICE_ACCOUNT_KEY: $(GOOGLE_SERVICE_ACCOUNT_KEY)
      timeoutInMinutes: 30

  - job: PlayBetaDeploy
    displayName: '🎯 Deploy to Play Console (Beta)'
    condition: and(succeeded(), eq('${{ parameters.deployPlayBeta }}', 'true'))
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: |
        cd $(workingDirectory)
        npm ci --legacy-peer-deps
        echo "EAS CLI is not present in mobile/package-lock.json."
        echo "Add eas-cli as a pinned mobile devDependency, regenerate package-lock.json, and let npm audit cover it before enabling Play Beta submissions."
        exit 1
      displayName: 'Block unaudited Play Beta submit'
      env:
        EXPO_TOKEN: $(EXPO_TOKEN)
        GOOGLE_SERVICE_ACCOUNT_KEY: $(GOOGLE_SERVICE_ACCOUNT_KEY)
      timeoutInMinutes: 30

  - job: PlayProductionDeploy
    displayName: '🚀 Deploy to Play Store (Production)'
    condition: and(succeeded(), eq('${{ parameters.deployPlayProduction }}', 'true'))
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: |
        cd $(workingDirectory)
        npm ci --legacy-peer-deps
        echo "EAS CLI is not present in mobile/package-lock.json."
        echo "Add eas-cli as a pinned mobile devDependency, regenerate package-lock.json, and let npm audit cover it before enabling Play Production submissions."
        exit 1
      displayName: 'Block unaudited Play Production submit'
      env:
        EXPO_TOKEN: $(EXPO_TOKEN)
        GOOGLE_SERVICE_ACCOUNT_KEY: $(GOOGLE_SERVICE_ACCOUNT_KEY)
      timeoutInMinutes: 30

- stage: Notify
  displayName: '📢 Notifications'
  dependsOn: 
  - Test
  - BuildiOS
  - BuildAndroid
  - Distribute
  - Deploy
  condition: always()
  jobs:
  - job: SendNotifications
    displayName: '📢 Send Completion Notifications'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - script: |
        echo "Mobile pipeline completed!"
        echo "=========================================="
        echo "Tests: ${{ parameters.runTests }}"
        echo "iOS Build: ${{ parameters.buildIOS }}"
        echo "Android Build: ${{ parameters.buildAndroid }}"
        echo "Build Profile: ${{ parameters.buildProfile }}"
        echo "=========================================="
        echo "Expo Updates: ${{ parameters.distributeExpoUpdates }}"
        echo "Firebase: ${{ parameters.distributeFirebase }}"
        echo "App Center: ${{ parameters.distributeAppCenter }}"
        echo "=========================================="
        echo "TestFlight: ${{ parameters.deployTestFlight }}"
        echo "App Store: ${{ parameters.deployAppStore }}"
        echo "Play Internal: ${{ parameters.deployPlayInternal }}"
        echo "Play Beta: ${{ parameters.deployPlayBeta }}"
        echo "Play Production: ${{ parameters.deployPlayProduction }}"
        echo "=========================================="
        echo "Release Notes: ${{ parameters.releaseNotes }}"
        
        # Add your notification logic here:
        # - Send Slack/Teams message
        # - Send email notification  
        # - Update project management tools
        # - Post to Discord/webhook
        
      displayName: 'Pipeline completion summary'
