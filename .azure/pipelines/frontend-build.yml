# Frontend Build and Test Pipeline  
# Manual trigger only to conserve build minutes

trigger: none
pr: none

variables:
  nodeVersion: '22.x'
  workingDirectory: '$(System.DefaultWorkingDirectory)/client'

stages:
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: Build
    displayName: 'Build Frontend'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    # Setup Node.js
    - task: NodeTool@0
      displayName: 'Use Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'

    # Cache npm dependencies
    - task: Cache@2
      displayName: 'Cache npm packages'
      inputs:
        key: 'npm | "$(Agent.OS)" | client/package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
          npm
        path: $(Pipeline.Workspace)/.npm

    # Install dependencies
    - script: |
        cd $(workingDirectory)
        npm ci --cache $(Pipeline.Workspace)/.npm --prefer-offline
      displayName: 'Install dependencies'

    # Lint code
    - script: |
        cd $(workingDirectory)
        npm run lint
      displayName: 'Lint code'

    # Type check
    - script: |
        cd $(workingDirectory)
        npm run typecheck
      displayName: 'TypeScript check'

    # Run tests
    - script: |
        cd $(workingDirectory)
        npm test -- --coverage --ci
      displayName: 'Run tests'

    # Publish test results (skipped - no JUnit reporter configured)
    # - task: PublishTestResults@2
    #   displayName: 'Publish test results'
    #   inputs:
    #     testResultsFormat: 'JUnit'
    #     testResultsFiles: '$(Agent.TempDirectory)/test-results/junit.xml'
    #     mergeTestResults: true
    #   condition: succeededOrFailed()

    # Publish code coverage
    - task: PublishCodeCoverageResults@1
      displayName: 'Publish code coverage'
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(workingDirectory)/coverage/cobertura-coverage.xml'
      condition: succeededOrFailed()

    # Security audit
    - script: |
        cd $(workingDirectory)
        npm audit --audit-level=high
      displayName: 'Security audit'

    # Build for staging (only on main branch)
    - script: |
        cd $(workingDirectory)
        cp .env.staging .env.production.local
        npm run build:staging
      displayName: 'Build application'
      # Create artifacts for all branches to support deployment

    # Create deployment package (only on main branch)
    - script: |
        cd $(workingDirectory)
        
        # Create deployment directory
        mkdir -p $(Build.ArtifactStagingDirectory)/frontend-deploy
        
        # Copy Next.js standalone build (includes server.js and all dependencies)
        cp -r .next/standalone/* $(Build.ArtifactStagingDirectory)/frontend-deploy/
        
        # Copy static assets to standalone directory structure
        cp -r .next/static $(Build.ArtifactStagingDirectory)/frontend-deploy/.next/
        cp -r public $(Build.ArtifactStagingDirectory)/frontend-deploy/
        
        # Create production package.json for standalone deployment
        cat > $(Build.ArtifactStagingDirectory)/frontend-deploy/package.json << 'EOF'
        {
          "name": "gathergrove-frontend",
          "version": "1.0.0",
          "scripts": {
            "start": "node server.js"
          },
          "dependencies": {}
        }
        EOF
        
        # Copy Next.js config
        cp next.config.ts $(Build.ArtifactStagingDirectory)/frontend-deploy/ || true
      displayName: 'Create deployment package'
      # Create artifacts for all branches to support deployment

    # Create ZIP package
    - task: ArchiveFiles@2
      displayName: 'Create deployment archive'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/frontend-deploy'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/frontend-deploy.zip'
        replaceExistingArchive: true
      # Create artifacts for all branches to support deployment

    # Publish build artifacts
    - task: PublishBuildArtifacts@1
      displayName: 'Publish build artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/frontend-deploy.zip'
        ArtifactName: 'frontend-drop'
        publishLocation: 'Container'
      # Create artifacts for all branches to support deployment
