# iOS Build Pipeline
# Manually triggerable pipeline for building iOS app locally on macOS agent
# Uses expo prebuild + xcodebuild (no EAS dependency)

trigger: none
pr: none

parameters:
- name: buildConfiguration
  displayName: 'Build Configuration'
  type: string
  default: 'Release'
  values:
  - 'Debug'
  - 'Release'

- name: buildForSimulator
  displayName: 'Build for Simulator'
  type: boolean
  default: true

variables:
  nodeVersion: '22.x'
  workingDirectory: '$(System.DefaultWorkingDirectory)/mobile'

stages:
- stage: Build
  displayName: 'Build iOS'
  jobs:
  - job: BuildiOS
    displayName: 'Build iOS App'
    pool:
      vmImage: 'macos-latest'

    steps:
    - task: NodeTool@0
      displayName: 'Setup Node.js'
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: |
        echo "Xcode version:"
        xcodebuild -version
        echo ""
        echo "Available SDKs:"
        xcodebuild -showsdks
        echo ""
        echo "Available simulators:"
        xcrun simctl list devices available | head -20
      displayName: 'Show Xcode info'

    - task: Cache@2
      displayName: 'Cache npm packages'
      inputs:
        key: 'npm | "$(Agent.OS)" | mobile/package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
          npm
        path: '$(Pipeline.Workspace)/.npm'

    - script: |
        cd $(workingDirectory)
        npm ci --legacy-peer-deps --cache $(Pipeline.Workspace)/.npm --prefer-offline
      displayName: 'Install dependencies'

    - script: |
        cd $(workingDirectory)
        npx expo prebuild --platform ios --clean
      displayName: 'Generate native iOS project'

    - task: Cache@2
      displayName: 'Cache CocoaPods'
      inputs:
        key: 'pods | "$(Agent.OS)" | $(workingDirectory)/ios/Podfile.lock'
        restoreKeys: |
          pods | "$(Agent.OS)"
        path: '$(workingDirectory)/ios/Pods'
      continueOnError: true

    - script: |
        cd $(workingDirectory)/ios
        pod install
      displayName: 'Install CocoaPods dependencies'

    - script: |
        cd $(workingDirectory)/ios

        SCHEME="GatherGroveMobile"
        WORKSPACE="GatherGroveMobile.xcworkspace"

        # Check if workspace exists, otherwise use project
        if [ ! -d "$WORKSPACE" ]; then
          echo "Workspace not found, looking for xcodeproj..."
          PROJECT=$(ls -d *.xcodeproj 2>/dev/null | head -1)
          if [ -z "$PROJECT" ]; then
            echo "##[error]No Xcode workspace or project found"
            exit 1
          fi
          echo "Using project: $PROJECT"

          # Get scheme name from project
          SCHEME=$(xcodebuild -project "$PROJECT" -list -json | python3 -c "import sys, json; data = json.load(sys.stdin); print(data['project']['schemes'][0])" 2>/dev/null || echo "")
          if [ -z "$SCHEME" ]; then
            SCHEME=$(basename "$PROJECT" .xcodeproj)
          fi

          BUILD_CMD="-project $PROJECT"
        else
          echo "Using workspace: $WORKSPACE"

          # Get scheme name from workspace
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c "import sys, json; data = json.load(sys.stdin); print(data['workspace']['schemes'][0])" 2>/dev/null || echo "")
          if [ -z "$SCHEME" ]; then
            SCHEME="GatherGroveMobile"
          fi

          BUILD_CMD="-workspace $WORKSPACE"
        fi

        echo "Using scheme: $SCHEME"
        echo "Build configuration: ${{ parameters.buildConfiguration }}"
        echo "Build for simulator: ${{ parameters.buildForSimulator }}"

        if [ "${{ parameters.buildForSimulator }}" = "True" ]; then
          # Build for simulator
          DESTINATION="generic/platform=iOS Simulator"
          ARCHIVE_PATH=""

          xcodebuild \
            $BUILD_CMD \
            -scheme "$SCHEME" \
            -configuration ${{ parameters.buildConfiguration }} \
            -destination "$DESTINATION" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty || xcodebuild \
            $BUILD_CMD \
            -scheme "$SCHEME" \
            -configuration ${{ parameters.buildConfiguration }} \
            -destination "$DESTINATION" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          # Find and copy the .app
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Built app: $APP_PATH"
            cp -R "$APP_PATH" ../ios-simulator.app

            # Create a zip for artifact
            cd ..
            zip -r ios-simulator-build.zip ios-simulator.app
            echo "Created: ios-simulator-build.zip"
          else
            echo "##[warning]No .app found in build output"
          fi
        else
          # Build for device (requires signing)
          echo "##[warning]Building for device requires code signing certificates."
          echo "##[warning]Configure Apple certificates in Azure DevOps Library for device builds."

          # Archive without signing (will fail for actual device deployment)
          xcodebuild \
            $BUILD_CMD \
            -scheme "$SCHEME" \
            -configuration ${{ parameters.buildConfiguration }} \
            -destination "generic/platform=iOS" \
            -archivePath build/$SCHEME.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive || echo "Archive completed (unsigned)"
        fi
      displayName: 'Build iOS app'
      timeoutInMinutes: 30

    - task: PublishBuildArtifacts@1
      displayName: 'Publish iOS simulator build'
      inputs:
        PathtoPublish: '$(workingDirectory)/ios-simulator-build.zip'
        ArtifactName: 'ios-simulator-build'
        publishLocation: 'Container'
      condition: |
        and(
          succeeded(),
          eq('${{ parameters.buildForSimulator }}', 'true')
        )

    - script: |
        echo "================================================"
        echo "iOS Build Complete"
        echo "================================================"
        echo "Configuration: ${{ parameters.buildConfiguration }}"
        echo "Simulator Build: ${{ parameters.buildForSimulator }}"
        echo ""
        if [ "${{ parameters.buildForSimulator }}" = "True" ]; then
          echo "Artifact: ios-simulator-build.zip"
          echo "This build can be run on iOS Simulator"
        else
          echo "Device builds require code signing setup"
        fi
        echo "================================================"
      displayName: 'Build Summary'
