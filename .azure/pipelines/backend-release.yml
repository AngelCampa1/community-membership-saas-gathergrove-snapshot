# Backend Release Pipeline
# Deploys artifacts from successful builds to staging and/or production
# Parameters allow selective deployment to specific environments

# This pipeline is triggered manually or by successful completion of the build pipeline
trigger: none

# Pipeline parameters for environment selection
parameters:
- name: deployToStaging
  displayName: 'Deploy to Staging'
  type: boolean
  default: true
- name: deployToProduction
  displayName: 'Deploy to Production'
  type: boolean
  default: false

# Resources - artifacts from build pipeline
resources:
  pipelines:
  - pipeline: backend_build
    source: backend-build
    trigger: none

variables:
  azureSubscription: 'Azure-GatherGrove-Connection'
  resourceGroupName: 'GatherGrove-prod'
  stagingAppName: 'api-gathergrove-staging'
  productionAppName: 'api-gathergrove-prod'

stages:
- stage: DeployStaging
  displayName: 'Deploy to Staging'
  condition: eq('${{ parameters.deployToStaging }}', 'true')
  jobs:
  - deployment: DeployToStaging
    displayName: 'Deploy Backend to Staging'
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'staging'
    strategy:
      runOnce:
        deploy:
          steps:
          # Download artifacts from build pipeline
          - download: backend_build
            artifact: backend-drop

          # Deploy to Azure App Service
          - task: AzureWebApp@1
            displayName: 'Deploy to Staging App Service'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'webAppLinux'
              appName: '$(stagingAppName)'
              package: '$(Pipeline.Workspace)/**/backend-drop/*.zip'
              runtimeStack: 'DOTNETCORE|9.0'

          # Configure App Settings separately
          - task: AzureAppServiceSettings@1
            displayName: 'Configure Staging App Settings'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appName: '$(stagingAppName)'
              resourceGroupName: '$(resourceGroupName)'
              appSettings: |
                [
                  {
                    "name": "ASPNETCORE_ENVIRONMENT",
                    "value": "Staging"
                  },
                  {
                    "name": "ASPNETCORE_URLS",
                    "value": "http://+:8080"
                  },
                  {
                    "name": "JWT_SECRET_KEY",
                    "value": "@Microsoft.KeyVault(SecretUri=https://gathergrove-keyvault-v2.vault.azure.net/secrets/JwtSecretKey/)"
                  }
                ]

          # Run database migrations
          - task: AzureCLI@2
            displayName: 'Run Database Migrations'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Database migrations will be handled by Entity Framework on startup"
                echo "Checking application health..."
                
                # Wait for app to start
                sleep 30
                
                # Test health endpoint
                response=$(curl -s -o /dev/null -w "%{http_code}" https://$(stagingAppName).azurewebsites.net/api/v1/health || echo "000")
                
                if [ "$response" = "200" ]; then
                  echo "✅ Staging deployment successful! API is healthy."
                else
                  echo "⚠️ API health check returned HTTP $response"
                  exit 1
                fi

- stage: DeployProduction
  displayName: 'Deploy to Production'
  dependsOn: 
  - ${{ if eq(parameters.deployToStaging, true) }}: 
    - DeployStaging
  condition: and(eq('${{ parameters.deployToProduction }}', 'true'), or(succeeded(), eq('${{ parameters.deployToStaging }}', 'false')))
  jobs:
  - deployment: DeployToProduction
    displayName: 'Deploy Backend to Production'
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          # Download artifacts from build pipeline
          # Download artifacts from build pipeline
          - download: backend_build
            artifact: backend-drop

          # Deploy to Azure App Service
          - task: AzureWebApp@1
            displayName: 'Deploy to Production App Service'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'webAppLinux'
              appName: '$(productionAppName)'
              package: '$(Pipeline.Workspace)/**/backend-drop/*.zip'
              runtimeStack: 'DOTNETCORE|9.0'

          # Configure App Settings separately
          - task: AzureAppServiceSettings@1
            displayName: 'Configure Production App Settings'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appName: '$(productionAppName)'
              resourceGroupName: '$(resourceGroupName)'
              appSettings: |
                [
                  {
                    "name": "ASPNETCORE_ENVIRONMENT",
                    "value": "Production"
                  },
                  {
                    "name": "ASPNETCORE_URLS",
                    "value": "http://+:8080"
                  },
                  {
                    "name": "JWT_SECRET_KEY",
                    "value": "@Microsoft.KeyVault(SecretUri=https://gathergrove-keyvault-v2.vault.azure.net/secrets/JwtSecretKey/)"
                  }
                ]

          # Verify production deployment
          - task: AzureCLI@2
            displayName: 'Verify Production Deployment'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Verifying production deployment..."
                
                # Wait for app to start
                sleep 30
                
                # Test health endpoint
                response=$(curl -s -o /dev/null -w "%{http_code}" https://$(productionAppName).azurewebsites.net/api/v1/health || echo "000")
                
                if [ "$response" = "200" ]; then
                  echo "✅ Production deployment successful! API is healthy."
                else
                  echo "⚠️ Production API health check returned HTTP $response"
                  exit 1
                fi