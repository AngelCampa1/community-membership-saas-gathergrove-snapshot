# Frontend Release Pipeline
# Deploys artifacts from successful builds to staging and/or production
# Parameters allow selective deployment to specific environments

# This pipeline is triggered manually only
trigger: none

# Pipeline parameters for environment selection
parameters:
- name: deployToStaging
  displayName: 'Deploy to Staging'
  type: boolean
  default: true
- name: deployToProduction
  displayName: 'Deploy to Production'
  type: boolean
  default: false

# Resources - artifacts from build pipeline
resources:
  pipelines:
  - pipeline: frontend_build
    source: frontend-build
    trigger: none

variables:
  azureSubscription: 'Azure-GatherGrove-Connection'
  resourceGroupName: 'GatherGrove-prod'
  stagingAppName: 'gathergrove-staging'
  productionAppName: 'gathergrove-prod'

stages:
- stage: DeployStaging
  displayName: 'Deploy to Staging'
  condition: eq('${{ parameters.deployToStaging }}', 'true')
  jobs:
  - deployment: DeployToStaging
    displayName: 'Deploy Frontend to Staging'
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'staging'
    strategy:
      runOnce:
        deploy:
          steps:
          # Download artifacts from build pipeline
          - download: frontend_build
            artifact: frontend-drop

          # Configure App Service for Node.js
          - task: AzureCLI@2
            displayName: 'Configure App Service Settings'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Configure Node.js runtime and settings
                az webapp config set \
                  --resource-group $(resourceGroupName) \
                  --name $(stagingAppName) \
                  --linux-fx-version "NODE|20-lts"
                
                # Set application settings
                az webapp config appsettings set \
                  --resource-group $(resourceGroupName) \
                  --name $(stagingAppName) \
                  --settings \
                    WEBSITE_NODE_DEFAULT_VERSION=20-lts \
                    SCM_DO_BUILD_DURING_DEPLOYMENT=false \
                    WEBSITES_ENABLE_APP_SERVICE_STORAGE=false \
                    PORT=8080

          # Deploy to Azure App Service
          - task: AzureWebApp@1
            displayName: 'Deploy to Staging App Service'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'webAppLinux'
              appName: '$(stagingAppName)'
              package: '$(Pipeline.Workspace)/frontend_build/frontend-drop/frontend-deploy.zip'
              runtimeStack: 'NODE|20-lts'

          # Verify deployment
          - script: |
              echo "Waiting for application to start..."
              sleep 30
              
              # Test if the application is responding
              response=$(curl -s -o /dev/null -w "%{http_code}" https://$(stagingAppName).azurewebsites.net/ || echo "000")
              
              if [ "$response" = "200" ]; then
                echo "✅ Staging deployment successful! Application is responding."
              else
                echo "⚠️ Deployment completed but application returned HTTP $response"
                echo "Check the application logs for issues."
                exit 1
              fi
            displayName: 'Verify deployment'

- stage: DeployProduction
  displayName: 'Deploy to Production'
  dependsOn: 
  - ${{ if eq(parameters.deployToStaging, true) }}: 
    - DeployStaging
  condition: and(eq('${{ parameters.deployToProduction }}', 'true'), or(succeeded(), eq('${{ parameters.deployToStaging }}', 'false')))
  jobs:
  - deployment: DeployToProduction
    displayName: 'Deploy Frontend to Production'
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          # Download artifacts from build pipeline
          - download: frontend_build
            artifact: frontend-drop

          # Configure App Service for Node.js
          - task: AzureCLI@2
            displayName: 'Configure App Service Settings'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Configure Node.js runtime and settings
                az webapp config set \
                  --resource-group $(resourceGroupName) \
                  --name $(productionAppName) \
                  --linux-fx-version "NODE|20-lts"
                
                # Set application settings
                az webapp config appsettings set \
                  --resource-group $(resourceGroupName) \
                  --name $(productionAppName) \
                  --settings \
                    WEBSITE_NODE_DEFAULT_VERSION=20-lts \
                    SCM_DO_BUILD_DURING_DEPLOYMENT=false \
                    WEBSITES_ENABLE_APP_SERVICE_STORAGE=false \
                    PORT=8080 \
                    NODE_ENV=production

          # Deploy to Azure App Service
          - task: AzureWebApp@1
            displayName: 'Deploy to Production App Service'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'webAppLinux'
              appName: '$(productionAppName)'
              package: '$(Pipeline.Workspace)/frontend_build/frontend-drop/frontend-deploy.zip'
              runtimeStack: 'NODE|20-lts'

          # Verify deployment
          - script: |
              echo "Waiting for application to start..."
              sleep 30
              
              # Test if the application is responding
              response=$(curl -s -o /dev/null -w "%{http_code}" https://$(productionAppName).azurewebsites.net/ || echo "000")
              
              if [ "$response" = "200" ]; then
                echo "✅ Production deployment successful! Application is responding."
              else
                echo "⚠️ Deployment completed but application returned HTTP $response"
                echo "Check the application logs for issues."
                exit 1
              fi
            displayName: 'Verify deployment'